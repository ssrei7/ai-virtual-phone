name: Test image reference

on:
  push:
    branches:
      - test-image-reference
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-image-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test image reference
        run: npm run test:image-reference

      - name: Check custom App SDK
        run: npm run check:sdk

      # 当前 main 基线有与本功能无关的历史类型错误；保留报告但不阻断专项验收。
      - name: TypeScript baseline
        continue-on-error: true
        run: npx tsc --noEmit

      # 当前仓库全量 lint 有历史错误；保留报告但不把它误判为本功能回归。
      - name: Repository lint baseline
        continue-on-error: true
        run: npm run lint
