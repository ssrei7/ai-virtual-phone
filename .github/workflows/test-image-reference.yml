name: Test image reference

on:
  push:
    branches:
      - test-image-reference
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-image-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test image reference
        run: npm run test:image-reference

      - name: Check custom App SDK
        run: npm run check:sdk

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
